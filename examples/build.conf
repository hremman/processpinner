# build.conf — конфигурация сборки ProcessPinner

# Путь к qmake (опционально, если не в PATH)
QMAKE=/opt/qt6/bin/qmake

# Инструмент сборки: make, ninja, msbuild, auto
MAKE_TOOL=ninja

# Количество потоков для параллельной сборки (0 = авто)
MAKE_THREADS=0

# Директория сборки
BUILD_DIR=build

# Директория деплоя
DEPLOY_DIR=deploy

# Только сборка (true/1/yes)
ONLY_BUILD=false

# Без упаковки (true/1/yes)
NO_PACKAGE=false

# Только показать changelog (true/1/yes)
CHANGELOG=false

# Принудительная платформа: windows, linux, darwin, auto
PLATFORM=auto

# Принудительный компилятор: msvc, gcc, clang, auto
COMPILER=auto